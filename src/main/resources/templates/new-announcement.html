<!DOCTYPE html>
<html th:fragment="header" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head lang="en" th:include="head :: head"> </head>

<body>
	<div lang="en" th:include="dashboard_header :: dashboard_header"></div>

	<!-- <div lang="en" th:include="left_sidebar :: returnToDashboard"></div> -->

	<main id="main" style="margin-left: 0px !important;" class="main position-relative">
		<input id="usrR" th:value="${userType}" type="hidden">

		<div class="pagetitle">
			<nav>
				<ol class="breadcrumb">
					<li class="breadcrumb-item active">New Announcement</li>
				</ol>
			</nav>
		</div>
		<section class="section dashboard yrTab">
			<div class="row">
				<div class="row">
					<div class="col-lg-12">
						<div class="card mb-4">
							<!--Start kajal 02 June 2025-->
							<div class="table-header-section d-flex justify-content-between align-items-center mb-3">
								<div class="search-part">
									<h4>Filter</h4>
									<div class="form-check form-check-inline">
										<input class="form-check-input data-whichWise" type="radio"
											name="radio-whichWise" id="announcement-search" value="announcementwise"
											checked> <label class="form-check-label" for="announcement-search">
											Announcement </label>

									</div>
									<div class="form-check form-check-inline">
										<input class="form-check-input data-whichWise" type="radio"
											name="radio-whichWise" id="misreport-search" value="misreportwise">
										<label class="form-check-label" for="misreport-search">MIS Report</label>
									</div>
								</div>
							</div>
							<!--end kajal-->
							<!-- Announcement Section -->
							<div id="announcementSection" class="toggle-section">
								<h5 class="fw-bold">Announcement</h5>
								<hr>
								<div class="yr-Rtable">
									<table class="common-table table datatable" id="announcementTable">
										<thead>
											<tr>
												<th>S.No.</th>
												<th>Department</th>
												<th>Office Name</th>
												<th>Type</th>
												<th>Created By</th>
												<th>Notification</th>
												<th>Created At</th>
												<th>Valid Till</th>
												<th>Attachment</th>
												<!-- <th>Active</th> -->
												<th>Visibility</th>

											</tr>
										</thead>
										<tbody>
											<tr th:each="a, stat : ${announcements}">
												<td th:text="${stat.index + 1}"></td>
												<td th:text="${a.department}"></td>
												<td th:text="${a.office_name}"></td>
												<td th:text="${a.type}"></td>
												<td th:text="${a.name_with_designation}"></td>
												<td th:text="${a.notification}"></td>
												<td th:text="${#dates.format(a.createdat, 'dd-MM-yyyy HH:mm:ss')}"></td>
												<td th:text="${#dates.format(a.validtill, 'dd-MM-yyyy HH:mm:ss')}"></td>
												<td>
													<a th:if="${a.filepath != null}"
														th:href="@{'/fileViewer?filename=' + ${a['filepath']} + '&name=document'}"
														target="_blank" title="Open Attachment">
														<i class="bi bi-eye"></i>
													</a>
													<span th:if="${a.filepath == null}">None</span>
												</td>

												<td>
													<div class="form-check form-switch">
														<input class="form-check-input announcement-toggle"
															type="checkbox" th:data-id="${a.id}"
															th:checked="${a.isactive == 1}" />
													</div>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>

							<!-- MIS Report Section -->
							<div id="misReportSection" class="toggle-section" style="display: none;">
								<div class="row d-flex">
									<div class="col">
										<h5 class="fw-bold">MIS Report</h5>
									</div>
									<div class="col button-part btn-wrapper ms-2 justify-content-end">
									
									
										<button class="btn btn-purple dwd-customBtnNo" title="Download Excel" value="buttons-excel"> <i
												class="bi bi-filetype-xls"></i></button>
										<button class="btn btn-black dwd-customBtnNo" title="Download PDF" value="buttons-pdf">
											<i class="bi bi-filetype-pdf"></i></button>
									
									</div>
									</div><hr>
								<div class="yr-Rtable">
									<table class="common-table table datatable" id="misReportTable">
										<thead>
											<tr>
												<th>S.No.</th>
												<th>Department</th>
												<th>Count</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="item, stat : ${misReport}">
												<td th:text="${stat.index + 1}"></td>
												<td th:text="${item.department}"></td>
												<td>
													<!-- <a th:href="@{'/departmentDetails?department=' + ${item.department}} class="department-count-link" th:data-department="${item.department}" th:text="${item.count}"
														th:text="${item.count}"></a> -->
													<a href="#"
														class="department-count-link"
														th:data-department="${item.department}"
														th:text="${item.count}"></a>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
							<!-- Department Details Modal -->
							<div class="modal fade" id="departmentDetailsModal" tabindex="-1"
								aria-labelledby="departmentDetailsModalLabel" aria-hidden="true">
								<div class="modal-dialog modal-xl" role="document">
									<div class="modal-content">
										<div class="modal-header">
											
											<button type="button" class="btn-close" data-bs-dismiss="modal"
												aria-label="Close"></button>
										</div>
										<div class="modal-body">
											

											<div class="yr-Rtable p-4">
												<table class="table table-bordered stripe" id="departmentDetailsTable" style="width: 100%;">
											</table>
											</div>

										</div>
										<div class="modal-footer"></div>
									</div>
								</div>
							</div>


							<!-- 12 June 2025 KAjal-->

							<!--end-->

							<!--end kajal-->
						</div>

					</div>
				</div>
		</section>
	</main>
	<!-- ======= Footer ======= -->
	<div lang="en" th:include="footer :: footer1"></div>
	<script th:src="@{/js/newAnnouncement.js}"></script>
</body>

</html>

<!--end kajal -->

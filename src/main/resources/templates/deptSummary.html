	<div lang="en" th:include="dashboard_header :: dashboard_header"></div>


	<div lang="en" th:include="left_sidebar :: returnToDashboard"></div>

	<main id="main" class="main">
			<div class="pagetitle mb-3">
            <nav>
                <ol class="breadcrumb">
                    <!-- <li class="breadcrumb-item"><a href="#">Home</a></li> -->
                    <li class="breadcrumb-item active">Department Summary Report</li>
                </ol>
            </nav>
        </div>
	
		<!-- End Page Title -->

		<section class="section dashboard">
			
			<div class="row">

				<!-- Left side columns -->
                <div class="col-lg-12 yrTab">
					<div class="card">
						<div class="card-body"> 
							<div class="table-header-section d-flex justify-content-between align-items-center mb-3">
								<div class="heading-part">
                                    <div class="search-part">
                                        <h4>Department Wise Filter</h4>
                                        <div class="form-check form-check-inline">
                                                <div class="form-input-block mt-2">
                                                    <select class="form-select" id="filterDept" aria-label="filterDept">
                                                     <option value="0">Select Department</option>
                                                     <option th:each="dept : ${department}"
                                                     th:value="${dept.department}"
                                                     th:text="${dept.department}"></option>
                                                    </select>
                                                </div>
                                        </div>
                                        </div>
								</div> 

                                

                                
                                
												<div class="button-part btn-wrapper ms-2">
													<button class="btn btn-purple btn-customBtn" title="Download Excel" value="buttons-excel">  <i class="bi bi-filetype-xls"></i></button>
													<button class="btn btn-black btn-customBtn" title="Download PDF" value="buttons-pdf"> <i class="bi bi-filetype-pdf"></i></button>
												</div>
							</div>
							<hr>
							<div class="yr-Rtable">
								<table class="table datatable table-bordered" id="deptSummRpt" style="width: 100%;">
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>
			
			
		</section>

	</main>

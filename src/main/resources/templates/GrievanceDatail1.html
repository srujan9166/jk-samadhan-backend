<style>
.left-panel {
	border-right: 1px solid #ddd;
	height: 100%;
}

.upper-part {
	border-bottom: 1px solid #ccc;
	/* Border between upper and scrollable part */
	padding: 10px;
	background-color: #f8f9fa;
}

.scrollable-part {
	overflow-y: auto;
}

.small-label {
	font-size: 0.875rem;
	font-weight: bold;
}

.value {
	word-break: break-word;
	/* Allow long descriptions to break into new lines */
}

.row:nth-child(even) {
	background-color: #f2f2f2;
	/* Alternate row background color */
}

.created-div {
	border: 1px solid #ccc;
	/* Add border to divs */
	padding: 10px;
	/* Add padding inside divs */
	margin: 5px 0;
	/* Add margin between divs */
	border-radius: 5px;
	/* Rounded corners */
	background-color: #f8f9fa;
	/* Light background */
}

.remark, .status {
	font-weight: bold;
	/* Bold for labels */
	margin-bottom: 5px;
	/* Space below remark */
}

.timestamp, .updated-by {
	display: inline-block;
	/* Inline block for positioning */
	font-size: 0.875rem;
	/* Smaller font size */
	color: #6c757d;
	/* Gray color */
}

.updated-by {
	float: right;
	/* Align to the right */
}
</style>

					<!-- correspondences -->
					<div class="mt-5">
						<div class="row grivance-wrapper">
							<div class="col-lg-12">
							<button class="grievancepdf btn btn-purple ms-auto mb-3" data-value="downloadgrpdf"
											data-value1="Grievance Detail">
											<i class='bx bx-download'></i>
										</button>
								<div class="card" id = "downloadgrpdf">
									<div class="card-body d-flex" style="height: 900px;">
										<div class="left-panel col-lg-8 d-flex flex-column p-0"
											th:each="Gdetail:${list}">
											<div class="bg-light upper-part p-3">
												<p class="alert alert-primary fw-bold"
													style="width: auto !important; border-radius: 10px !important;">
													Application ID : <span id="gId" th:text="${Gdetail.uniqid}"></span>
												</p>
												<!-- Form Fields -->
												<div class="container mt-5">
													<div class="row mb-3">
														<div class="col-sm-3 small-label">Name:</div>
														<div class="col-sm-3 value" id="name"
															th:text="${Gdetail.name}"></div>
														<div class="col-sm-3 small-label">Mobile No:</div>
														<div class="col-sm-3 value" id="mobile"
															th:text="${Gdetail.mobile}"></div>
													</div>
													<div class="row mb-3">
														<div class="col-sm-3 small-label">Email ID:</div>
														<div class="col-sm-3 value" id="email"
															th:text="${Gdetail.submitted_by}"></div>
														<div class="col-sm-3 small-label">Address:</div>
														<div class="col-sm-3 value" id="address"
															th:text="${Gdetail.address}"></div>
													</div>
													<div class="row mb-3">
														<div class="col-sm-3 small-label">Department:</div>
														<div class="col-sm-3 value" id="department"
															th:text="${Gdetail.department}"></div>
														<div class="col-sm-3 small-label">Category:</div>
														<div class="col-sm-3 value" id="category"
															th:text="${Gdetail.category}"></div>
													</div>
													<div class="row mb-3">
														<div class="col-sm-3 small-label">Description:</div>
														<div class="col-sm-9 value" id="description"
															th:text="${Gdetail.description}"></div>
													</div>
													<div class="row mb-3">
														<div class="col-sm-3 small-label">Submitted On:</div>
														<div class="col-sm-9 value" id="submitted"
															th:text="${Gdetail.createddate}"></div>
													</div>
													<div class="row mb-3">
														<div class="col-sm-3 small-label">Latitude:</div>
														<div class="col-sm-3 value" id="latitude"
															th:text="${Gdetail.latitude}"></div>
														<div class="col-sm-3 small-label">Longitude:</div>
														<div class="col-sm-3 value" id="longitude"
															th:text="${Gdetail.longitude}"></div>
													</div>
												</div>
											</div>
											<div class="scrollable-part overflow-auto p-3 flex-grow-1"
												style="background: var(--body)">
												<div class="descHis" th:each="detail : ${hisQ}">
													<div class="created-div">
														<div class="status">
															Status: <span th:text="${detail['status'] ?: 'N/A'}"></span>
														</div>
														<div class="remarks">
															Remarks: <span th:text="${detail['remarks'] ?: 'N/A'}"></span>
														</div>
														<div class="remarks">
															<span th:text="${detail['updated_on'] ?: 'N/A'}"></span>
														</div>
														<div class="timestamp">
															<span th:text="${detail['action_taken_by'] ?: 'N/A'}"></span>
														</div>
														<div class="updated-by">
															<span th:text="${detail['action_taken'] ?: 'N/A'}"></span>
														</div>
													</div>
												</div>

											</div>
										</div>
										<div
											class="bg-light right-panel col-lg-4 d-flex flex-column p-0">
											<div class="p-3">
												<p class="alert alert-primary fw-bold"
													style="width: auto !important; border-radius: 10px !important;">
													Attached Doc / Files</p>
												<!-- <p>Some fixed content here</p> -->
											</div>
											<div class="p-3 flex-grow-1" style="background: var(--body)">
												<div class="descHisDoc" th:each="detail : ${hisQ}">
												     <!--  Department document -->
													<div
														th:if="${detail['dept_file_name'] != null && detail['dept_file_name'] != ''}">
														<div class="status">
															Uploaded By: <span
																th:text="${detail['action_taken_by'] ?: 'N/A'}"></span>
														</div>
														<div class="remarks">
															File Name: <span
																th:text="${detail['dept_file_name'] ?: 'No file name'}"></span>
														</div>
														<div class="timestamp" th:text="${detail['updated_on']}"></div>
														<div class="updated-by" style="margin-top: -10px;">
															<a class="btn-view btn-pur fileViewer" href="#"
																th:attr="data-filename=${detail['depdocument']}, data-name=${detail['dept_file_name']}"
																title="View"> <i class="bi bi-eye-fill"></i>
															</a>
															<!-- Uncomment the following line to include the download button -->
															<!-- <a class="btn-view btn-blue fileDownloader" title="Download"><i class="bi bi-cloud-arrow-down-fill"></i></a> -->
														</div>
													</div>
													<!--  User document -->
													<div
														th:if="${detail['file_name'] != null && detail['file_name'] != ''}">
														<div class="status">
															Uploaded By User
														</div>
														<div class="remarks">
															File Name: <span
																th:text="${detail['file_name'] ?: 'No file name'}"></span>
														</div>
														<div class="timestamp" th:text="${detail['updated_on']}"></div>
														<div class="updated-by" style="margin-top: -10px;">
															<a class="btn-view btn-pur fileViewer" href="#"
																th:attr="data-filename=${detail['file_path']}, data-name=${detail['file_name']}"
																title="View"> <i class="bi bi-eye-fill"></i>
															</a>
															<!-- Uncomment the following line to include the download button -->
															<!-- <a class="btn-view btn-blue fileDownloader" title="Download"><i class="bi bi-cloud-arrow-down-fill"></i></a> -->
														</div>
													</div>
													
													<!--  Acknoledgement sleep document -->
													<div
														th:if="${detail['ack_slip_name'] != null && detail['ack_slip_name'] != ''}">
														<div class="status">
															Uploaded By User
														</div>
														<div class="remarks">
															File Name: <span
																th:text="${detail['ack_slip_name'] ?: 'No file name'}"></span>
														</div>
														<div class="timestamp" th:text="${detail['updated_on']}"></div>
														<div class="updated-by" style="margin-top: -10px;">
															<a class="btn-view btn-pur fileViewer" href="#"
																th:attr="data-filename=${detail['ack_slip_path']}, data-name=${detail['ack_slip_path']}"
																title="View"> <i class="bi bi-eye-fill"></i>
															</a>
															<!-- Uncomment the following line to include the download button -->
															<!-- <a class="btn-view btn-blue fileDownloader" title="Download"><i class="bi bi-cloud-arrow-down-fill"></i></a> -->
														</div>
													</div>
													
													<div class="d-none descHisDocCitz"></div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- correspondences -->

				</section>

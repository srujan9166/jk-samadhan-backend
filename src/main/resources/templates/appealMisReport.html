<!DOCTYPE html>
<html th:fragment="header" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org">

<head lang="en" th:include="head :: head"> </head>

<body>
    <div lang="en" th:include="dashboard_header :: dashboard_header"></div>

    <!-- <div lang="en" th:include="left_sidebar :: returnToDashboard"></div> -->

    <main id="main" style="margin-left: 0px !important;" class="main position-relative">
        <input id="usrR" th:value="${userType}" type="hidden">


        <section class="mt-4">
            <div class="col-lg-12 yrTab1">
                <div class="card">
                    <div class="card-body">
                        <div class="table-header-section d-flex justify-content-between align-items-center mb-3">
                            <div class="heading-part col">
                                <div class="row">
                                    <h4>MIS Report Table</h4>

                                </div>
                                <div class=" mt-2 row w-40">
                                    <div class="form-input-block">
                                        <label for="departmentss1">List of Departments:</label>
                                        <select class="form-select" id="departmentss1">
                                            <option value="0">Select</option>
                                        </select>
                                    </div>

                                </div>
                            </div>



                            <div class="button-part btn-wrapper ms-2">
                                <button id="excelExport" class="btn btn-purple btn-customBtnAppeal"
                                    title="Download Excel" value="buttons-excel">
                                    <i class="bi bi-filetype-xls"></i>
                                </button>
                                <button id="pdfExport" class="btn btn-black btn-customBtnAppeal" title="Download PDF"
                                    value="buttons-pdf">
                                    <i class="bi bi-filetype-pdf"></i>
                                </button>
                            </div>
                        </div>

                        <div class="yr-Rtable py-3">
                            <table class="table table-bordered stripe" id="misReportTableAppeal" style="width: 100%;">

                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- ======= Footer ======= -->
    <div lang="en" th:include="footer :: footer1"></div>
    <script th:src="@{/js/appealMisReport.js}"></script>
</body>

</html>

<!--end kajal -->

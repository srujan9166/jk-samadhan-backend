server.port = 8081
spring.application.name=jk-samadhan-backend

# spring.datasource.url=jdbc:postgresql://localhost:5432/jks_db?currentSchema=jks_3nf
spring.datasource.url=jdbc:postgresql://localhost:5432/jks_db_srujan
spring.datasource.username=postgres
spring.datasource.password=srujan

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=jks_3nf

logging.level.org.springframework.security=DEBUG

# spring.sql.init.schema-locations=classpath:migration/redesigned_schema_3nf.sql
# spring.sql.init.mode=never

# Disable Open Session In View to prevent holding connections during serialization
spring.jpa.open-in-view=false

# HikariCP Tuning parameters (optimized for workload)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
